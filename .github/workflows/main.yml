name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Traer el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configurar Java (Vital para que Maven funcione)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compilar el proyecto y generar el archivo .jar
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Autenticar en DockerHub (Como en el ejemplo de clase)
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Construir y subir la imagen usando tus nombres reales
      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-educativa:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-educativa:latest

      # 6. Desplegar en EC2 (Usando el método SSH que ya validamos)
      - name: SSH commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Entrar a DockerHub desde el servidor
            echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            # Actualizar la imagen y reiniciar el contenedor
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-educativa:latest
            docker stop plataforma-app || true
            docker rm plataforma-app || true
            docker run -d --name plataforma-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/plataforma-educativa:latest